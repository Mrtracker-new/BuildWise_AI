name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # One command runs the suite, the page-1/PDF/SVG parity contracts, the
      # rectangle-equivalence block and the full invariant sweep.  The sweep is
      # allowed a non-zero exit only when its verdict names zero TRUE FAILURES
      # (a DISCLOSED-only register); see backend/scripts/qa_gates.py.
      - name: Backend QA gates
        working-directory: backend
        run: python scripts/qa_gates.py

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build
      - name: Report surface (L16 table, FAIL stamp, print wiring)
        working-directory: frontend
        run: npm run test:report-surface

  browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/app > /dev/null && break
            sleep 1
          done
      # google-chrome is preinstalled on ubuntu-latest; both scripts accept
      # CHROME_PATH when a runner needs a different binary.
      - name: Selection-path browser gate
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:5173/app
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:selection-policy
      - name: Server logs on failure
        if: failure()
        run: |
          echo "--- backend ---"; tail -80 /tmp/backend.log || true
          echo "--- frontend ---"; tail -40 /tmp/frontend.log || true
